name: Generate and Normalize Reflow HTML

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/create_reflow_files.py'
      - 'tools/normalize_reflow_html.py'
      - '202603/**/*_epub.html'
      - '202603/目次_epub.html'
      - '202603/epub.css'
      - '.github/workflows/normalize-reflow-html.yml'

permissions:
  contents: write

jobs:
  reflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate reflow files
        run: python tools/create_reflow_files.py

      - name: Normalize reflow HTML
        run: python tools/normalize_reflow_html.py

      - name: Commit reflow files
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 202603/**/*_reflow.html 202603/目次_reflow.html 202603/reflow.css
          git commit -m "Generate reflow HTML files"
          git push
