<header><div class="scoop-tag">異世界丸見え実話 202604</div><h1>魔物の育て方 新入生編</h1><p class="lead">春に飼い始めがちな小型魔物、危険な卵、ペット商法、飼育放棄を注意喚起風に扱う。</p></header>
<h2>かわいいだけでは飼えない</h2><p>春の露店には、小型魔物の卵や幼体が並ぶ。新生活の寂しさを埋める相棒として売られるが、育つ速度や食費は説明されないことが多い。</p>
<h2>初心者が見落とす点</h2><ul><li>夜行性かどうか</li><li>成体時の大きさ</li><li>餌の入手難度</li><li>鳴き声と近所づきあい</li></ul><p>飼育は癒やしであると同時に、毎日の責任である。</p>
<h2>本誌の見立て</h2><p>魔物を飼うなら、かわいさより先に契約書と飼育書を見るべきだ。</p><p>春の衝動買いは、夏には手に余る同居人になる。</p>
