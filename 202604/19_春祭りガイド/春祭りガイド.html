<header><div class="scoop-tag">異世界丸見え実話 202604</div><h1>春祭りガイド</h1><p class="lead">王都春祭りの歩き方を紹介する誌面企画。</p></header>
<h2>春の王都を歩く</h2><p>春祭りの時期、王都の通りには屋台、見物客、旅人が集まる。中央広場から南門通りまで、昼夜を問わずにぎわう。</p>
<h2>見どころ</h2><p>朝は市場、昼は広場、夕方は花見通りがおすすめである。混み合うため、待ち合わせ場所は先に決めておきたい。</p>
<h2>本誌の見立て</h2><p>春祭りは、王都の明るさと雑多さを一度に見られる季節の催しである。</p>
