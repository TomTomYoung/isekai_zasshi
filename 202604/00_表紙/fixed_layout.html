<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1456, initial-scale=1.0">
  <title>異世界丸見え実話 202604 表紙</title>
  <style>
    html,body{margin:0;padding:0;background:#111;color:#111}
    .fixed-page{width:1456px;height:2056px;box-sizing:border-box;margin:0 auto;position:relative;overflow:hidden;background:linear-gradient(180deg,#ffe48a 0%,#f6b43a 38%,#d32121 100%);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,sans-serif;border:18px solid #111}
    .masthead{position:absolute;left:54px;right:54px;top:54px;background:#111;color:#ffd800;border:10px solid #fff;padding:20px 28px;text-align:center;font-size:88px;line-height:1;font-weight:900;letter-spacing:-.06em;box-shadow:12px 12px 0 #d32121}
    .issue{position:absolute;right:80px;top:210px;background:#fff;color:#111;border:8px solid #111;padding:8px 22px;font-size:40px;font-weight:900;transform:rotate(4deg)}
    .main{position:absolute;left:70px;right:70px;top:330px;background:#fff6bf;border:12px solid #111;padding:30px 34px;box-shadow:14px 14px 0 #111;transform:rotate(-1.5deg)}
    .main h1{font-size:92px;line-height:1.03;margin:0;color:#d32121;text-shadow:5px 5px 0 #ffd800;letter-spacing:-.08em}
    .girl{position:absolute;right:90px;bottom:240px;width:440px;height:760px;background:#f7d2b8;border:10px solid #111;border-radius:220px 220px 60px 60px;box-shadow:16px 16px 0 rgba(0,0,0,.35)}
    .girl:before{content:"";position:absolute;left:70px;top:70px;width:300px;height:210px;background:#5b2a12;border:8px solid #111;border-radius:50% 50% 38% 38%}
    .girl:after{content:"";position:absolute;left:128px;top:220px;width:190px;height:120px;background:#fff;border:8px solid #111;border-radius:50%}
    .callouts{position:absolute;left:62px;bottom:86px;width:720px;display:grid;gap:16px}
    .callout{background:#fff;color:#111;border:8px solid #111;padding:14px 20px;font-size:38px;line-height:1.15;font-weight:900;box-shadow:8px 8px 0 #ffd800}
    .callout:nth-child(2n){background:#111;color:#fff;box-shadow:8px 8px 0 #d32121}
    .stamp{position:absolute;right:72px;bottom:78px;background:#ffd800;border:10px solid #111;border-radius:50%;width:300px;height:300px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:46px;line-height:1.05;font-weight:900;transform:rotate(-12deg)}
  </style>
</head>
<body>
  <main class="fixed-page">
    <div class="masthead">異世界丸見え実話</div>
    <div class="issue">2026年4月号</div>
    <section class="main"><h1>王都春の<br>新生活トラブル<br>総力特集</h1></section>
    <div class="girl"></div>
    <section class="callouts">
      <div class="callout">新人冒険者を食い物にする春の闇商売</div>
      <div class="callout">ギルド登録所 大混乱の一日</div>
      <div class="callout">花見ダンジョンでまた失踪者</div>
      <div class="callout">脱法スキル講習会に潜入</div>
      <div class="callout">王都下宿ぼったくり事情</div>
    </section>
    <div class="stamp">春祭り<br>警備隊<br>襲撃事件</div>
  </main>
</body>
</html>
