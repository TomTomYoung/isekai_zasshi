<header><div class="scoop-tag">異世界丸見え実話 202604</div><h1>王都東門荷馬車横転事件</h1><p class="lead">春の王都東門で起きた荷馬車横転騒ぎを、交通と物流の話題として追う。</p></header>
<h2>東門で止まった春の荷物</h2><p>春の東門は、王都へ入る荷物と人で混み合う。家具、食器、衣類、道具を積んだ荷馬車が列を作り、門番の確認を待っていた。</p>
<h2>混雑の背景</h2><p>新生活の時期には、地方から王都へ移る人が増える。荷物の量も増え、少しの遅れが長い待ち時間につながる。</p>
<h2>本誌の見立て</h2><p>春の王都はにぎやかだが、にぎやかさは混雑も連れてくる。入口で起きる小さな騒ぎは、街全体の変化を映している。</p>
