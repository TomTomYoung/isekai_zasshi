<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fixed_layout PNG Preview</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="toolbar">
    <div class="title-block">
      <strong>fixed_layout PNG Preview</strong>
      <span>Playwright基準 1456 × 2056 CSS px</span>
    </div>
    <label>
      記事
      <select id="article-select"></select>
    </label>
    <label class="source-label">
      fixed_layout.html
      <input id="source-path" type="text" spellcheck="false">
    </label>
    <button id="load-button" type="button">表示</button>
    <label>
      表示倍率
      <select id="zoom-select">
        <option value="auto">自動</option>
        <option value="0.25">25%</option>
        <option value="0.33">33%</option>
        <option value="0.5">50%</option>
        <option value="0.67">67%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
      </select>
    </label>
    <label class="check-label">
      <input id="guide-toggle" type="checkbox" checked>
      青枠
    </label>
    <a id="direct-link" target="_blank" rel="noopener">原本を直接開く</a>
  </header>

  <section class="status-bar">
    <span id="status">読み込み待ち</span>
    <span>青線はページ境界です。ページ内部のレイアウトには手を加えません。</span>
  </section>

  <main id="workspace" class="workspace">
    <div id="stage-sizer" class="stage-sizer">
      <iframe id="preview-frame" title="fixed layout preview"></iframe>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
