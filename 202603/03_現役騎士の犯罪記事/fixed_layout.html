<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1456, initial-scale=1.0">
  <title>固定レイアウト版</title>
  <link rel="stylesheet" href="fixed_layout.css">
</head>
<body>
  <main class="article-pages" id="article-pages"></main>
  <script>
    (async () => {
      const pages = document.getElementById('article-pages');
      const parts = decodeURIComponent(location.pathname).split('/').filter(Boolean);
      const folderName = parts.slice(-2, -1)[0] || '';
      const articleNo = (folderName.match(/^(\d+)_/) || [null, '00'])[1];
      const source = folderName.replace(/^\d+_/, '') + '.html';

      function makePage(index) {
        const page = document.createElement('section');
        page.className = 'fixed-page article-no-' + articleNo;
        page.dataset.pageIndex = String(index + 1).padStart(3, '0');

        const sheet = document.createElement('section');
        sheet.className = 'article-sheet';
        sheet.dataset.articleNo = articleNo;
        sheet.dataset.source = source;
        page.appendChild(sheet);
        pages.appendChild(page);
        return sheet;
      }

      const res = await fetch(source);
      const text = await res.text();
      const doc = new DOMParser().parseFromString(text, 'text/html');
      const title = doc.querySelector('title');
      if (title) document.title = title.textContent + '｜固定レイアウト版';

      const article = doc.querySelector('article, .chapter, main, body');
      const staging = document.createElement('div');
      staging.innerHTML = article ? article.innerHTML : text;
      staging.querySelectorAll('script, style, link[rel="stylesheet"]').forEach(el => el.remove());

      const h1 = staging.querySelector('h1');
      if (h1) {
        const slug = document.createElement('div');
        slug.className = 'gossip-slug';
        slug.textContent = '本誌独占　異世界ゴシップ総力取材班';
        h1.before(slug);
      }

      const firstFigure = staging.querySelector('figure, .photo-block');
      if (firstFigure) firstFigure.classList.add('hero-photo');

      staging.querySelectorAll('h2').forEach((h2, i) => {
        h2.dataset.index = String(i + 1).padStart(2, '0');
      });

      staging.querySelectorAll('figcaption').forEach(caption => {
        caption.classList.add('tabloid-caption');
      });

      const nodes = Array.from(staging.childNodes).filter(node => {
        return node.nodeType !== Node.TEXT_NODE || node.textContent.trim();
      });

      let sheet = makePage(0);
      for (const node of nodes) {
        sheet.appendChild(node);
        if (sheet.scrollHeight > sheet.clientHeight && sheet.childNodes.length > 1) {
          sheet.removeChild(node);
          sheet = makePage(pages.children.length);
          sheet.appendChild(node);
        }
      }
    })();
  </script>
</body>
</html>
