<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760" role="img" aria-label="異世界雑誌表紙用イラスト。路地裏で泥酔する聖女、張り込み記者、王都の夜景、ダンジョンの門を描いたゴシップ誌風表紙絵。">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1228"/>
      <stop offset="0.58" stop-color="#43223b"/>
      <stop offset="1" stop-color="#8c3b25"/>
    </linearGradient>
    <linearGradient id="alley" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#332a31"/>
      <stop offset="1" stop-color="#121016"/>
    </linearGradient>
    <radialGradient id="flash" cx="42%" cy="38%" r="55%">
      <stop offset="0" stop-color="#fff6b8" stop-opacity="0.95"/>
      <stop offset="0.34" stop-color="#ffd400" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd400" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#111" opacity="0.16"/>
      <circle cx="12" cy="12" r="1.5" fill="#111" opacity="0.10"/>
    </pattern>
    <filter id="hardShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="9" dy="10" stdDeviation="0" flood-color="#111" flood-opacity="1"/>
    </filter>
  </defs>

  <rect width="980" height="760" fill="url(#night)"/>
  <rect width="980" height="760" fill="url(#dots)" opacity="0.48"/>
  <rect width="980" height="760" fill="url(#flash)"/>

  <!-- distant royal capital -->
  <g stroke="#09090c" stroke-width="5" fill="#17131d">
    <path d="M0 405 L40 405 L40 325 L76 325 L76 405 L125 405 L125 285 L172 242 L220 285 L220 405 L286 405 L286 332 L330 332 L330 405 L395 405 L395 250 L430 210 L468 250 L468 405 L530 405 L530 330 L580 330 L580 405 L650 405 L650 292 L710 244 L770 292 L770 405 L838 405 L838 325 L888 325 L888 405 L980 405 L980 760 L0 760 Z"/>
    <path d="M156 252 L172 135 L188 252" fill="#17131d"/>
    <path d="M414 218 L430 92 L448 218" fill="#17131d"/>
    <path d="M688 255 L710 120 L732 255" fill="#17131d"/>
  </g>
  <g fill="#ffd400" opacity="0.82">
    <rect x="54" y="350" width="15" height="20"/>
    <rect x="144" y="326" width="16" height="18"/>
    <rect x="189" y="314" width="14" height="17"/>
    <rect x="414" y="300" width="16" height="18"/>
    <rect x="690" y="330" width="14" height="18"/>
    <rect x="745" y="342" width="14" height="19"/>
    <rect x="858" y="354" width="15" height="18"/>
  </g>

  <!-- alley walls and ground -->
  <path d="M0 760 L0 404 C92 388 190 398 282 450 C214 534 172 638 158 760 Z" fill="url(#alley)" stroke="#111" stroke-width="7"/>
  <path d="M980 760 L980 404 C870 390 780 404 690 456 C756 548 798 642 822 760 Z" fill="url(#alley)" stroke="#111" stroke-width="7"/>
  <path d="M155 760 C220 575 320 482 490 465 C660 482 760 575 825 760 Z" fill="#2a2024" stroke="#111" stroke-width="7"/>
  <path d="M232 758 C292 602 378 536 490 526 C602 536 688 602 748 758" fill="none" stroke="#ffd400" stroke-width="7" opacity="0.5"/>

  <!-- dungeon gate in background -->
  <g transform="translate(620 398) scale(0.78)" opacity="0.96">
    <path d="M0 248 L0 90 C0 34 46 0 108 0 L280 0 C342 0 388 34 388 90 L388 248 Z" fill="#51463f" stroke="#111" stroke-width="9"/>
    <path d="M82 248 L82 122 C82 64 126 34 194 34 C262 34 306 64 306 122 L306 248 Z" fill="#111" stroke="#ffd400" stroke-width="7"/>
    <text x="194" y="79" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="900" fill="#ffd400">危険地帯</text>
    <path d="M110 133 C154 104 236 104 278 133" fill="none" stroke="#c40018" stroke-width="9"/>
  </g>

  <!-- tabloid flash photographer -->
  <g transform="translate(72 458)" filter="url(#hardShadow)">
    <path d="M58 240 L84 122 C92 85 124 65 162 72 C200 80 218 110 209 148 L186 240 Z" fill="#222" stroke="#111" stroke-width="7"/>
    <circle cx="162" cy="58" r="44" fill="#d5a078" stroke="#111" stroke-width="7"/>
    <path d="M118 53 C130 10 188 5 214 46 C188 34 157 38 118 53Z" fill="#111"/>
    <rect x="160" y="105" width="118" height="76" rx="7" fill="#111" stroke="#ffd400" stroke-width="6"/>
    <circle cx="222" cy="143" r="28" fill="#2d4555" stroke="#fff" stroke-width="7"/>
    <rect x="186" y="76" width="55" height="38" fill="#111" stroke="#ffd400" stroke-width="5"/>
    <polygon points="272,84 356,32 330,132" fill="#fff6b8" stroke="#ffd400" stroke-width="6" opacity="0.9"/>
    <text x="57" y="282" font-family="sans-serif" font-size="28" font-weight="900" fill="#ffd400" stroke="#111" stroke-width="2">張り込み班</text>
  </g>

  <!-- drunk saint central figure -->
  <g transform="translate(338 268)" filter="url(#hardShadow)">
    <!-- halo, crooked -->
    <ellipse cx="174" cy="34" rx="86" ry="22" fill="none" stroke="#ffd400" stroke-width="12" transform="rotate(-10 174 34)"/>
    <ellipse cx="174" cy="34" rx="60" ry="13" fill="none" stroke="#fff4a0" stroke-width="5" transform="rotate(-10 174 34)"/>

    <!-- hair -->
    <path d="M98 98 C95 40 146 12 198 32 C250 53 272 114 247 176 C216 146 164 146 118 177 C100 150 96 124 98 98Z" fill="#f7f2d4" stroke="#111" stroke-width="7"/>
    <path d="M122 78 C155 104 205 108 238 82" fill="none" stroke="#d0c58d" stroke-width="8"/>

    <!-- face -->
    <circle cx="174" cy="116" r="69" fill="#f1c6aa" stroke="#111" stroke-width="7"/>
    <path d="M132 118 C144 108 156 108 168 119" fill="none" stroke="#111" stroke-width="5"/>
    <path d="M190 118 C204 108 218 109 229 122" fill="none" stroke="#111" stroke-width="5"/>
    <circle cx="149" cy="138" r="12" fill="#e96b73" opacity="0.65"/>
    <circle cx="212" cy="140" r="12" fill="#e96b73" opacity="0.65"/>
    <path d="M155 158 C176 178 207 176 222 155" fill="none" stroke="#8b1e2b" stroke-width="6"/>

    <!-- body robe -->
    <path d="M68 420 C78 280 90 190 143 168 C162 202 192 203 215 168 C270 193 291 286 306 420 Z" fill="#fff" stroke="#111" stroke-width="8"/>
    <path d="M119 194 L174 305 L230 194" fill="none" stroke="#ffd400" stroke-width="12"/>
    <path d="M113 418 C126 316 145 248 174 206 C204 250 225 322 240 418" fill="#e9e5ff" stroke="#111" stroke-width="6" opacity="0.75"/>

    <!-- arms bottle -->
    <path d="M91 232 C30 238 8 300 42 348 C66 378 118 352 112 306" fill="#fff" stroke="#111" stroke-width="7"/>
    <path d="M258 223 C332 230 348 292 312 340 C286 374 240 346 247 302" fill="#fff" stroke="#111" stroke-width="7"/>
    <g transform="translate(12 257) rotate(-22)">
      <rect x="0" y="0" width="54" height="122" rx="15" fill="#3c7a4a" stroke="#111" stroke-width="7"/>
      <rect x="13" y="-32" width="28" height="44" fill="#3c7a4a" stroke="#111" stroke-width="7"/>
      <rect x="6" y="40" width="42" height="34" fill="#ffd400" stroke="#111" stroke-width="5"/>
    </g>

    <!-- fallen paper / scandal tag -->
    <g transform="translate(42 420) rotate(5)">
      <rect width="280" height="72" fill="#ffd400" stroke="#111" stroke-width="7"/>
      <text x="140" y="48" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="900" fill="#111">聖女泥酔!?</text>
    </g>
  </g>

  <!-- knight and succubus silhouette scandal -->
  <g transform="translate(610 204) rotate(6)" filter="url(#hardShadow)">
    <rect x="0" y="0" width="286" height="210" fill="#fff6c8" stroke="#111" stroke-width="8"/>
    <rect x="20" y="22" width="246" height="128" fill="#2d1831" stroke="#111" stroke-width="5"/>
    <path d="M70 145 L88 74 L126 74 L146 145 Z" fill="#c8d4dd" stroke="#111" stroke-width="5"/>
    <circle cx="108" cy="58" r="26" fill="#c8d4dd" stroke="#111" stroke-width="5"/>
    <path d="M174 145 L188 82 C195 54 234 53 244 82 L260 145 Z" fill="#6f1d78" stroke="#111" stroke-width="5"/>
    <circle cx="218" cy="58" r="25" fill="#c68aa2" stroke="#111" stroke-width="5"/>
    <path d="M198 40 L184 12 M234 40 L250 12" stroke="#111" stroke-width="6"/>
    <text x="143" y="187" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="900" fill="#c40018">不倫疑惑</text>
  </g>

  <!-- illegal artifact / potion foreground -->
  <g transform="translate(675 578) rotate(-8)" filter="url(#hardShadow)">
    <rect width="230" height="128" fill="#f4ecd2" stroke="#111" stroke-width="7"/>
    <text x="115" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="900" fill="#c40018">脱法ポーション</text>
    <path d="M62 78 L80 40 L98 78 L90 104 L70 104 Z" fill="#00ffcc" stroke="#111" stroke-width="5"/>
    <path d="M135 58 L170 102 L100 102 Z" fill="#ffd400" stroke="#111" stroke-width="5"/>
  </g>

  <!-- bottom headline ribbon -->
  <g transform="translate(192 662) rotate(-2)" filter="url(#hardShadow)">
    <rect width="595" height="72" fill="#ffd400" stroke="#111" stroke-width="9"/>
    <text x="297" y="50" text-anchor="middle" font-family="sans-serif" font-size="43" font-weight="900" fill="#111">王都の闇、全部載せ。</text>
  </g>
</svg>
